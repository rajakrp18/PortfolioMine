<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#rp-grad)" filter="url(#shadow)"/>
  
  <!-- Subtle High-Contrast Inner Border for Dark Mode Browser Tabs -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- RP Bold Branding -->
  <text x="32" y="40.5" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.8">RP</text>
  
  <!-- Signature Pulsing Green Availability Indicator -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
</svg>
